[project]
name = "ball-beam-pid"
version = "1.0.0"
description = "Nonlinear ball-and-beam PID simulation with Kalman state estimation and Streamlit visualisation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "plotly>=5.18,<7",
  "streamlit>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
